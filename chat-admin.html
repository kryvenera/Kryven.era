<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>KRYVEN ERA | Customer Chat Inbox</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f5f5f2;color:#171717}.chat-app{max-width:1150px;margin:auto;padding:18px}.chat-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.chat-top h1{font-size:20px;margin:0}.chat-top a{color:#111}.chat-layout{display:grid;grid-template-columns:minmax(230px,340px) 1fr;gap:14px;min-height:75vh}.chat-list,.chat-thread{background:#fff;border:1px solid #e2e2df;border-radius:14px;overflow:hidden}.chat-list h2,.thread-head{padding:14px;margin:0;border-bottom:1px solid #eee;font-size:14px}.chat-conv{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #eee;padding:13px;cursor:pointer;color:#111}.chat-conv.active{background:#f2ecdf}.chat-conv b{display:block}.chat-conv small{display:block;color:#777;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-conv em{font-size:11px;color:#96712d}.thread-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.thread-head button{border:1px solid #ddd;background:white;padding:7px 10px;border-radius:8px}.thread-msgs{height:58vh;min-height:300px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px;background:#fafafa}.thread-msg{max-width:82%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.thread-msg.customer{align-self:flex-start;background:#eee}.thread-msg.support{align-self:flex-end;background:#e9dfca}.thread-msg.system{align-self:center;background:#fff;border:1px solid #eee;font-size:12px}.thread-msg time{display:block;font-size:10px;color:#777;margin-top:5px}.reply-form{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}.reply-form input{flex:1;min-width:0;border:1px solid #ddd;border-radius:9px;padding:12px}.reply-form button{background:#111;color:#fff;border:0;border-radius:9px;padding:0 16px}.muted{color:#777;padding:15px}.chat-error{color:#a11;padding:10px}.status{font-size:11px;color:#777}@media(max-width:700px){.chat-app{padding:10px}.chat-layout{grid-template-columns:1fr}.chat-list{max-height:34vh;overflow:auto}.thread-msgs{height:40vh;min-height:240px}.chat-top h1{font-size:16px}}
</style></head><body><main class="chat-app"><header class="chat-top"><h1>KRYVEN ERA · Customer Chat</h1><a href="admin.html">← Back to Admin</a></header><div id="authError" class="chat-error" hidden></div><div class="chat-layout"><section class="chat-list"><h2>Conversations <span class="status">· auto refresh</span></h2><div id="conversationList" class="muted">Loading conversations…</div></section><section class="chat-thread"><div class="thread-head"><div><b id="threadTitle">Select a conversation</b><div class="status" id="threadStatus">Customer messages appear here.</div></div><button id="closeChat" disabled>Close chat</button></div><div id="threadMessages" class="thread-msgs"><div class="muted">Choose a conversation from the list.</div></div><form id="replyForm" class="reply-form"><input id="replyInput" maxlength="1500" placeholder="Write a reply…" disabled required><button id="replyButton" disabled>Reply</button></form></section></div><div id="pageError" class="chat-error"></div></main><script defer src="chat-admin.js"></script></body></html>
