<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3e7">
<title>KRYVEN ERA — Online Payment</title>
<link rel="icon" type="image/png" href="favicon.png?v=20261005-logo-v2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css?v=20261005-logo-v2">
<link rel="stylesheet" href="kryven-upgrade.css?v=20261005-logo-v2">
<style>
.payment-page{padding:28px 0 70px}.payment-shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(310px,.68fr);gap:18px;align-items:start}.payment-card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 16px 48px rgba(20,25,20,.06)}.payment-card h1{margin:8px 0 10px;font:700 clamp(38px,5vw,58px)/.98 'Playfair Display',serif}.payment-card h2{margin:0;font:700 26px 'Playfair Display',serif}.payment-note{padding:13px 15px;border-radius:14px;background:#eef3e7;color:#59615b;font-size:10px;line-height:1.6;margin-top:14px}.payment-summary{background:#111512;color:#fff;border-radius:24px;padding:21px;position:sticky;top:112px}.payment-summary .kicker{font-size:9px;letter-spacing:.16em;color:#c5cac4;font-weight:900}.pay-items{display:grid;gap:9px;margin:15px 0}.pay-item{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.1)}.pay-item img{width:48px;height:58px;border-radius:10px;object-fit:cover;background:#eee}.pay-item b{font-size:11px}.pay-item small{display:block;color:#aeb4ae;font-size:9px;margin-top:3px}.pay-lines{display:grid;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}.pay-line{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#c0c6bf}.pay-line.total{padding-top:9px;margin-top:4px;border-top:1px solid rgba(255,255,255,.13);font-size:16px;color:#fff}.pay-line.total b:last-child{font:700 24px 'Playfair Display',serif}.cashfree-button{width:100%;min-height:54px;border:0;border-radius:999px;background:var(--gold);color:#1a1d1a;font-weight:900;letter-spacing:.08em;font-size:11px;margin-top:20px}.cashfree-button:disabled{opacity:.48}.payment-status{display:none;margin-top:14px;padding:13px;border-radius:14px;font-size:10px;line-height:1.55}.payment-status.show{display:block}.payment-status.ok{background:#e9f7ec;color:#245d2c}.payment-status.err{background:#fff0ee;color:#8e332c}.payment-status.wait{background:#eef3e7;color:#5b635c}.secure-list{display:grid;gap:7px;margin-top:15px;font-size:10px;color:#646c66}.back-link{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#68706b}.pending-order{padding:12px;border:1px dashed var(--line);border-radius:12px;margin-top:14px;font-size:10px;color:#666d68}@media(max-width:900px){.payment-shell{grid-template-columns:1fr}.payment-summary{position:relative;top:auto}}@media(max-width:680px){.payment-card{padding:17px}.payment-summary{padding:17px;border-radius:20px}}
</style>
</head>
<body data-page="payment-standalone">
<div id="paymentApp"></div>
<script src="checkout-flow.js?v=20261005-logo-v2"></script>
</body>
</html>
