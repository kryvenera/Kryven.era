<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Help — Kryven ErA</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="nav"><a class="brand" href="../index.html"><span>KRYVEN</span><b>ErA</b></a><nav><a href="shop.html">SHOP</a><a href="customize.html">CUSTOMIZE</a><a href="help.html">HELP</a></nav><div class="nav-actions"><a href="checkout.html">BAG <span id="bagCount">0</span></a></div></header><main class="page"><div class="page-head"><div><span class="micro">KRYVEN ErA / CONCIERGE</span><h1>HOW CAN<br>WE HELP?</h1></div><div class="status">ONLINE · REPLY IN SECONDS</div></div><div class="chatbox"><div class="chat-head"><strong>KRYVEN CONCIERGE</strong><div class="muted" style="font-size:11px;margin-top:6px">Orders · sizing · customization · shipping</div></div><div class="chat-log" id="log"><div class="msg">Welcome to Kryven ErA. Tell me what you need—product info, size help, customization or order support.</div></div><form class="chat-form" id="chat"><input id="msg" placeholder="Type a message…" autocomplete="off"><button class="pill primary">SEND</button></form></div></main><div class="toast"></div><script src="../assets/app.js"></script><script>const f=document.getElementById('chat'),log=document.getElementById('log'),input=document.getElementById('msg');function add(m,cl=''){let e=document.createElement('div');e.className='msg '+cl;e.textContent=m;log.appendChild(e);log.scrollTop=log.scrollHeight}f.onsubmit=e=>{e.preventDefault();let m=input.value.trim();if(!m)return;add(m,'user');input.value='';setTimeout(()=>{let r=/size|fit|large|small/i.test(m)?'For the Obsidian Tee, the relaxed fit usually works true to size. Ask me for exact garment measurements.':/custom/i.test(m)?'Open Custom Studio to change color, logo and scale. Your saved design can be connected to checkout.':/order|ship|delivery/i.test(m)?'For live order tracking, connect this chat to your order API in production.':'I can help with product details, sizing, customization and checkout.';add(r);},450)}</script></body></html>
