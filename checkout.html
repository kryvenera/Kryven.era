<head>

<title>KRYVEN ERA — Checkout</title>

<style>
.checkout-standalone{padding:26px 0 70px}.checkout-standalone .page-title{padding:40px 0 22px}.checkout-shell{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);gap:18px;align-items:start}.checkout-main{display:grid;gap:14px}.checkout-panel{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 14px 40px rgba(20,25,20,.05)}.checkout-panel h2{margin:0;font:700 25px/1 'Playfair Display',serif}.checkout-panel-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}.checkout-panel-head .step{display:flex;gap:12px;align-items:center}.checkout-panel-head .step>span{width:32px;height:32px;border-radius:10px;background:#eef3e7;display:grid;place-items:center;font-size:10px;font-weight:900}.checkout-panel-head small{font-size:10px;color:var(--muted)}.checkout-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.checkout-field{display:grid;gap:6px}.checkout-field.full{grid-column:1/-1}.checkout-field label{font-size:9px;letter-spacing:.12em;font-weight:900;color:#5b625f}.checkout-field input,.checkout-field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 14px;font:500 13px 'DM Sans',sans-serif;color:var(--ink);outline:none;box-sizing:border-box}.checkout-field textarea{resize:vertical;min-height:92px}.checkout-field input:focus,.checkout-field textarea:focus{border-color:rgba(191,142,44,.72);box-shadow:0 0 0 4px rgba(191,142,44,.11)}.checkout-field-error{font-size:10px;color:#b72d2d}.field-invalid{border-color:#c94444!important;box-shadow:0 0 0 4px rgba(201,68,68,.1)!important}.pay-choice-grid{display:grid;gap:10px}.pay-choice{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px;text-align:left}.pay-choice input{accent-color:var(--gold);flex:0 0 auto}.pay-choice-body{flex:1;display:grid;gap:4px}.pay-choice-body b{font-size:13px}.pay-choice-body small{font-size:10px;color:var(--muted)}.pay-action{min-height:48px;padding:0 15px;border-radius:999px;border:1px solid var(--gold);background:var(--gold);font-weight:900;letter-spacing:.08em;font-size:10px}.pay-choice.online{border-color:rgba(215,173,89,.55);background:linear-gradient(135deg,#fff,#fbf6e8)}.pay-choice.cod{background:#fbfcf9}.checkout-actions{display:grid;gap:10px;margin-top:15px}.checkout-actions button{width:100%}.checkout-summary{position:sticky;top:112px;background:#111512;color:#fff;border-radius:24px;padding:20px;box-shadow:0 20px 60px rgba(8,10,8,.2)}.checkout-summary .kicker{font-size:9px;letter-spacing:.16em;color:#c7ccc6;font-weight:900}.checkout-item{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.1)}.checkout-item img{width:48px;height:58px;border-radius:10px;object-fit:cover;background:#eee}.checkout-item b{font-size:11px}.checkout-item small{display:block;font-size:9px;color:#aeb4ae;margin-top:3px}.checkout-lines{display:grid;gap:8px;padding:14px 0;border-top:1px solid rgba(255,255,255,.1);margin-top:10px}.checkout-line{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#c1c8c1}.checkout-line.total{font-size:16px;color:#fff;padding-top:10px;border-top:1px solid rgba(255,255,255,.14)}.checkout-line.total b{font:700 24px 'Playfair Display',serif}.saved-note{padding:11px 12px;border-radius:12px;background:#eef3e7;color:#5d655f;font-size:10px;margin-top:12px}.checkout-back{display:inline-flex;align-items:center;gap:7px;margin-bottom:5px;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#6b716d}.checkout-error{display:none;padding:12px;border-radius:12px;background:#fff0ee;color:#8f332b;font-size:10px;margin-bottom:12px}.checkout-error.show{display:block}.checkout-summary .muted{color:#c2c7c2}@media(max-width:900px){.checkout-shell{grid-template-columns:1fr}.checkout-summary{position:relative;top:auto}}@media(max-width:680px){.checkout-fields{grid-template-columns:1fr}.checkout-field.full{grid-column:auto}.checkout-panel{padding:16px}.checkout-standalone{padding-top:10px}.checkout-summary{padding:17px;border-radius:20px}.checkout-panel-head{display:grid}.pay-action{min-height:44px}.checkout-item{grid-template-columns:44px minmax(0,1fr);}.checkout-item>strong{grid-column:2}.checkout-summary h2{font-size:22px}}
</style>
</head>
<body data-page="checkout-standalone">

</html>
