<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Kryven ErA</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="nav"><a class="brand" href="../index.html"><span>KRYVEN</span><b>ErA</b></a><div class="nav-actions"><a href="help.html">HELP</a></div></header><main class="page"><div class="page-head"><div><span class="micro">KRYVEN ErA / CHECKOUT</span><h1>SECURE<br>CHECKOUT.</h1></div></div><div class="checkout-grid"><section class="panel"><span class="micro">ORDER SUMMARY</span><div id="summary" class="order-summary"></div><div class="row"><span>Subtotal</span><b id="subtotal">₹0</b></div><div class="row"><span>Shipping</span><b>₹99</b></div><div class="row"><span>Total</span><b id="total">₹99</b></div></section><section class="panel"><span class="micro">UPI PAYMENT</span><p class="muted">This demo displays your UPI QR flow. Production auto-confirmation requires a verified payment gateway/webhook rather than a browser-only check.</p><div class="qr" id="qr">QR<br>CODE</div><div class="status" id="payStatus">WAITING FOR PAYMENT</div><button class="pill primary" id="start">START PAYMENT MONITOR</button></section></div></main><div class="toast"></div><script src="../assets/app.js"></script><script>const b=STORE.getBag();let sum=0,el=document.getElementById('summary');if(!b.length){el.innerHTML='<div class="muted">Your bag is empty. Add a product first.</div>'}else{b.forEach(x=>{sum+=x.price*x.qty;let r=document.createElement('div');r.className='row';r.innerHTML='<span>'+x.name+' · '+x.size+'</span><b>₹'+(x.price*x.qty).toLocaleString('en-IN')+'</b>';el.appendChild(r)})}document.getElementById('subtotal').textContent='₹'+sum.toLocaleString('en-IN');document.getElementById('total').textContent='₹'+(sum+99).toLocaleString('en-IN');document.getElementById('start').onclick=()=>{let s=document.getElementById('payStatus');s.textContent='MONITORING PAYMENT…';setTimeout(()=>{s.textContent='DEMO ONLY — VERIFY WITH GATEWAY WEBHOOK';toast('Connect a payment gateway webhook for real auto-confirmation');},1800)};</script></body></html>
